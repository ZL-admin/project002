<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>星愿 · 天机命理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="star-canvas"></canvas>

<div class="topbar">
  <div>
    <div class="topbar-title">🏮 星愿</div>
    <div class="topbar-sub">许下心愿，让星空见证</div>
  </div>
</div>

<div class="page">
  <div style="height:16px;"></div>

  <!-- Lantern Sky -->
  <div class="lantern-sky fade-in" id="lantern-sky" style="margin-bottom:12px;"></div>

  <!-- Wish Input -->
  <div class="card fade-in-2" style="margin-bottom:12px;">
    <div class="section-title">许下心愿</div>
    <div class="form-group">
      <textarea class="form-input" id="wish-input" rows="3"
        placeholder="写下你最深的心愿…" style="resize:none;"></textarea>
    </div>
    <button class="btn btn-gold btn-full" onclick="releaseWish()">🏮 放飞心愿灯</button>
  </div>

  <!-- Wish History -->
  <div class="card fade-in-3" style="margin-bottom:16px;">
    <div class="section-title">心愿记录</div>
    <div id="wish-list"><div class="empty"><div class="empty-icon">✨</div>还未许下心愿，写下第一个吧</div></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>首页</a>
  <a href="destiny.html" class="nav-item"><span class="nav-icon">☯️</span>命运</a>
  <a href="sign.html"    class="nav-item"><span class="nav-icon">🔮</span>今日签</a>
  <a href="yuanfen.html" class="nav-item"><span class="nav-icon">💑</span>缘分</a>
  <a href="dream.html"   class="nav-item"><span class="nav-icon">🌙</span>解梦</a>
</nav>

<script>
(function(){const c=document.getElementById('star-canvas'),ctx=c.getContext('2d');let stars=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}function init(){resize();stars=Array.from({length:120},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+0.2,a:Math.random(),speed:Math.random()*0.003+0.001}));}function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a+=s.speed;if(s.a>1)s.a=0;const alpha=Math.abs(Math.sin(s.a*Math.PI));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,100,${alpha*0.8})`;ctx.fill();});requestAnimationFrame(draw);}window.addEventListener('resize',init);init();draw();})();

let wishes = JSON.parse(localStorage.getItem('starWishes')||'[]');
renderWishes();

function releaseWish() {
  const text = document.getElementById('wish-input').value.trim();
  if (!text) { alert('先写下你的心愿吧 ✦'); return; }

  // Add lantern
  const sky = document.getElementById('lantern-sky');
  const skyRect = sky.getBoundingClientRect();
  const lantern = document.createElement('div');
  lantern.className = 'lantern';
  const x = 20 + Math.random() * (sky.offsetWidth - 80);
  const drift = (Math.random()-0.5)*80;
  const dur = 3 + Math.random()*2;
  lantern.style.cssText = `left:${x}px;--drift:${drift}px;animation-duration:${dur}s;`;
  lantern.innerHTML = '<div class="lantern-shape"></div>';
  sky.appendChild(lantern);
  setTimeout(() => lantern.remove(), dur*1000+100);

  // Save wish
  wishes.unshift({ text, time: new Date().toLocaleString('zh-CN') });
  if (wishes.length > 20) wishes.pop();
  localStorage.setItem('starWishes', JSON.stringify(wishes));
  document.getElementById('wish-input').value = '';
  renderWishes();
}

function renderWishes() {
  if (!wishes.length) return;
  document.getElementById('wish-list').innerHTML = wishes.map((w,i) =>
    `<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;">
      <span style="font-size:16px;">🏮</span>
      <div>
        <div style="font-size:14px;color:var(--text);line-height:1.5;">${w.text}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:4px;">${w.time}</div>
      </div>
    </div>`
  ).join('');
}
</script>
</body>
</html>
