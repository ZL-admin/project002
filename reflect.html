<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sage · Reflect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">Reflect</div>
    <div class="topbar-sub" id="reflect-date">—</div>
  </div>
</div>

<div class="page">
  <div style="height:14px;"></div>

  <!-- Mood check-in -->
  <div class="card fade-in" style="margin-bottom:12px;">
    <div class="section-title">How are you feeling?</div>
    <div class="mood-row" id="mood-row">
      <div class="mood-chip" data-mood="heavy" onclick="selectMood(this)">
        <span class="mood-emoji">😔</span>Heavy
      </div>
      <div class="mood-chip" data-mood="okay" onclick="selectMood(this)">
        <span class="mood-emoji">😐</span>Okay
      </div>
      <div class="mood-chip" data-mood="soft" onclick="selectMood(this)">
        <span class="mood-emoji">🌸</span>Soft
      </div>
      <div class="mood-chip" data-mood="bright" onclick="selectMood(this)">
        <span class="mood-emoji">✨</span>Bright
      </div>
      <div class="mood-chip" data-mood="grounded" onclick="selectMood(this)">
        <span class="mood-emoji">🌿</span>Grounded
      </div>
    </div>
  </div>

  <!-- Today's prompt -->
  <div class="intention-card fade-in-2" style="margin-bottom:12px;">
    <div class="intention-label">Today's Prompt</div>
    <div class="intention-text" id="daily-prompt">—</div>
  </div>

  <!-- Journal -->
  <div class="card fade-in-3" style="margin-bottom:12px;">
    <div class="section-title">Your thoughts</div>
    <textarea class="journal-area" id="journal-area"
      placeholder="Write freely — this is just for you…"></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
      <span style="font-size:12px;color:var(--text3);" id="save-status"></span>
      <button class="btn btn-rose" onclick="saveEntry()" style="padding:10px 22px;font-size:14px;">
        Save
      </button>
    </div>
  </div>

  <!-- 7-day mood history -->
  <div class="card fade-in-4" style="margin-bottom:12px;">
    <div class="section-title">This week</div>
    <div class="mood-history-row" id="mood-history"></div>
  </div>

  <!-- Past entries -->
  <div id="entries-section" style="display:none;">
    <div class="section-title" style="margin-bottom:10px;padding-left:4px;">Recent entries</div>
    <div id="entries-list"></div>
  </div>

  <div style="height:8px;"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html"   class="nav-item"><span class="nav-icon">◎</span>Today</a>
  <a href="reflect.html" class="nav-item active"><span class="nav-icon">◇</span>Reflect</a>
  <a href="breathe.html" class="nav-item"><span class="nav-icon">○</span>Breathe</a>
  <a href="wisdom.html"  class="nav-item"><span class="nav-icon">✦</span>Wisdom</a>
  <a href="destiny.html" class="nav-item"><span class="nav-icon">◉</span>You</a>
</nav>

<script>
const today = new Date();
const todayStr = today.toISOString().slice(0, 10);
const DAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
document.getElementById('reflect-date').textContent =
  `${DAYS[today.getDay()]}, ${MONTHS[today.getMonth()]} ${today.getDate()}`;

// Prompts pool (seeded by date)
const PROMPTS = [
  'What would you like to let go of before this day ends?',
  'Where did you feel most like yourself today?',
  'What moment today held unexpected beauty?',
  'What are you grateful for that you often overlook?',
  'What did you need today that you didn\'t ask for?',
  'If your body could speak right now, what would it say?',
  'What conversation has been playing on repeat in your mind?',
  'What version of yourself showed up today?',
  'What would you do differently if you knew things would work out?',
  'What do you need permission to stop doing?',
  'What small act of kindness can you offer yourself today?',
  'What fear is masquerading as a practical concern right now?',
  'What would feel like taking care of yourself today?',
  'Who or what are you carrying in your heart today?',
  'What question is your life asking you right now?',
  'How does today feel in your body — not just your head?',
  'What assumption are you making that might not be true?',
  'What part of you needs to be seen right now?',
  'What would feel like a relief to admit?',
  'How would you describe this season of your life in three words?'
];
const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
document.getElementById('daily-prompt').textContent = PROMPTS[seed % PROMPTS.length];

// Restore today's mood
const todayMoodKey = 'mood_' + todayStr;
const savedMood = localStorage.getItem(todayMoodKey);
if (savedMood) {
  const chip = document.querySelector(`.mood-chip[data-mood="${savedMood}"]`);
  if (chip) chip.classList.add('selected');
}

function selectMood(el) {
  document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  localStorage.setItem(todayMoodKey, el.dataset.mood);
  const hist = JSON.parse(localStorage.getItem('mood_history') || '[]');
  const entry = { date: todayStr, mood: el.dataset.mood };
  const idx = hist.findIndex(e => e.date === entry.date);
  if (idx >= 0) hist[idx] = entry; else hist.push(entry);
  localStorage.setItem('mood_history', JSON.stringify(hist.slice(-30)));
  renderMoodHistory();
}

// Restore today's journal draft
const journalKey = 'journal_' + todayStr;
const savedDraft = localStorage.getItem(journalKey + '_draft');
if (savedDraft) document.getElementById('journal-area').value = savedDraft;
document.getElementById('journal-area').addEventListener('input', function() {
  localStorage.setItem(journalKey + '_draft', this.value);
  document.getElementById('save-status').textContent = '';
});

function saveEntry() {
  const text = document.getElementById('journal-area').value.trim();
  if (!text) return;
  const entries = JSON.parse(localStorage.getItem('journal_entries') || '[]');
  const existing = entries.findIndex(e => e.date === todayStr);
  const entry = { date: todayStr, text, ts: Date.now() };
  if (existing >= 0) entries[existing] = entry; else entries.unshift(entry);
  localStorage.setItem('journal_entries', JSON.stringify(entries.slice(0, 60)));
  document.getElementById('save-status').textContent = 'Saved ✓';
  renderEntries();
}

// 7-day mood history
const MOOD_EMOJIS = { heavy: '😔', okay: '😐', soft: '🌸', bright: '✨', grounded: '🌿' };
const DAY_SHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function renderMoodHistory() {
  const hist = JSON.parse(localStorage.getItem('mood_history') || '[]');
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dStr = d.toISOString().slice(0, 10);
    const entry = hist.find(e => e.date === dStr);
    days.push({ day: DAY_SHORT[d.getDay()], mood: entry ? entry.mood : null });
  }
  document.getElementById('mood-history').innerHTML = days.map(d => `
    <div class="mood-dot-wrap">
      <div class="mood-dot" style="${d.mood ? 'background:var(--rose-dim);border-color:var(--border2);' : ''}">
        ${d.mood ? MOOD_EMOJIS[d.mood] : ''}
      </div>
      <div class="mood-dot-day">${d.day}</div>
    </div>`).join('');
}

function renderEntries() {
  const entries = JSON.parse(localStorage.getItem('journal_entries') || '[]');
  const sec = document.getElementById('entries-section');
  const list = document.getElementById('entries-list');
  if (entries.length === 0) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  const recent = entries.filter(e => e.date !== todayStr).slice(0, 5);
  if (recent.length === 0) { sec.style.display = 'none'; return; }
  list.innerHTML = recent.map(e => {
    const d = new Date(e.date);
    const label = `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
    const preview = e.text.length > 120 ? e.text.slice(0, 120) + '…' : e.text;
    return `<div class="entry-card"><div class="entry-date">${label}</div><div class="entry-text">${preview}</div></div>`;
  }).join('');
}

renderMoodHistory();
renderEntries();
</script>
</body>
</html>
