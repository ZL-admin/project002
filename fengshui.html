<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>能量空间 · 天机命理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="star-canvas"></canvas>

<div class="topbar">
  <div>
    <div class="topbar-title">🧿 能量空间</div>
    <div class="topbar-sub">你家 / 办公室的运气格局</div>
  </div>
</div>

<div class="page">
  <div style="height:16px;"></div>

  <!-- Compass -->
  <div class="card fade-in" style="margin-bottom:12px;">
    <div class="section-title">风水罗盘</div>
    <div class="compass-wrap">
      <div class="compass">
        <div class="compass-dir n">北</div>
        <div class="compass-dir s">南</div>
        <div class="compass-dir e">东</div>
        <div class="compass-dir w">西</div>
        <div class="compass-dir ne">东北</div>
        <div class="compass-dir nw">西北</div>
        <div class="compass-dir se">东南</div>
        <div class="compass-dir sw">西南</div>
        <div class="compass-center">☯</div>
      </div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text3);margin-top:8px;">罗盘持续运转，感知能量场</div>
  </div>

  <!-- Eight Directions -->
  <div class="card fade-in-2" style="margin-bottom:12px;">
    <div class="section-title">八方能量</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;" id="eight-dirs"></div>
  </div>

  <!-- Room Advice -->
  <div class="card fade-in-3" style="margin-bottom:12px;">
    <div class="section-title">居家风水建议</div>
    <div id="room-advice"></div>
  </div>

  <!-- Lucky Areas -->
  <div class="card fade-in-4" style="margin-bottom:16px;">
    <div class="section-title">今年运势方位</div>
    <div id="lucky-areas"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>首页</a>
  <a href="destiny.html" class="nav-item"><span class="nav-icon">☯️</span>命运</a>
  <a href="sign.html"    class="nav-item"><span class="nav-icon">🔮</span>今日签</a>
  <a href="yuanfen.html" class="nav-item"><span class="nav-icon">💑</span>缘分</a>
  <a href="dream.html"   class="nav-item"><span class="nav-icon">🌙</span>解梦</a>
</nav>

<script>
(function(){const c=document.getElementById('star-canvas'),ctx=c.getContext('2d');let stars=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}function init(){resize();stars=Array.from({length:80},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1+0.2,a:Math.random(),speed:Math.random()*0.003+0.001}));}function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a+=s.speed;if(s.a>1)s.a=0;const alpha=Math.abs(Math.sin(s.a*Math.PI));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(150,200,255,${alpha*0.4})`;ctx.fill();});requestAnimationFrame(draw);}window.addEventListener('resize',init);init();draw();})();

const DIRS = [
  {dir:'东',gua:'震',elem:'木',meaning:'生气方',color:'#4caf50',desc:'主事业与健康，植物盆栽、木质家具可增旺此方能量。'},
  {dir:'东南',gua:'巽',elem:'木',meaning:'文昌方',color:'#66bb6a',desc:'主财运与学业，书桌、文昌塔放置此方可催旺财运。'},
  {dir:'南',gua:'离',elem:'火',meaning:'离宫方',color:'#ef5350',desc:'主名誉与桃花，红色装饰或长明灯可提升个人魅力。'},
  {dir:'西南',gua:'坤',elem:'土',meaning:'爱情方',color:'#ff9800',desc:'主感情与母缘，双数摆设、粉水晶可助力感情运势。'},
  {dir:'西',gua:'兑',elem:'金',meaning:'财帛方',color:'#bdbdbd',desc:'主财富与子女，金属摆件或白色系可激活财气。'},
  {dir:'西北',gua:'乾',elem:'金',meaning:'贵人方',color:'#e0e0e0',desc:'主贵人与领导缘，金属风铃或六枚铜钱可招贵人。'},
  {dir:'北',gua:'坎',elem:'水',meaning:'仕途方',color:'#1e88e5',desc:'主事业与财运，流水摆件或鱼缸可旺此方水气。'},
  {dir:'东北',gua:'艮',elem:'土',meaning:'鬼门方',color:'#795548',desc:'此方能量较重，宜保持整洁明亮，避免杂乱堆积。'}
];

document.getElementById('eight-dirs').innerHTML = DIRS.map(d =>
  `<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <div style="width:28px;height:28px;border-radius:50%;background:${d.color}22;border:1px solid ${d.color}44;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:13px;color:${d.color};">${d.gua}</div>
      <div>
        <div style="font-size:13px;color:var(--text);">${d.dir}方 · ${d.meaning}</div>
        <div style="font-size:11px;color:${d.color};">${d.elem}</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);line-height:1.6;">${d.desc}</div>
  </div>`
).join('');

const rooms = [
  {room:'客厅',icon:'🛋️',advice:'宜保持宽敞整洁，沙发背后有实墙为佳，主色调选用暖色系，可在东南角摆放常青植物。'},
  {room:'卧室',icon:'🛏️',advice:'床头不宜对门，避免镜子正对床铺，枕头朝向以东或南为吉，床下保持整洁勿堆杂物。'},
  {room:'书房',icon:'📚',advice:'书桌宜面朝门但不正对门，背后有靠山（实墙）最佳，书籍整齐摆放，文昌方（东南）放书桌。'},
  {room:'厨房',icon:'🍳',advice:'灶台忌背对门，灶与水槽保持距离（水火不相容），厨房宜明亮整洁，北方为凶，宜设厨于东南。'},
  {room:'玄关',icon:'🚪',advice:'入户玄关是财气入口，宜明亮整洁，可放置招财摆件，避免鞋柜过高或门正对卫生间。'}
];
document.getElementById('room-advice').innerHTML = rooms.map(r =>
  `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
    <span style="font-size:20px;">${r.icon}</span>
    <div>
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;">${r.room}</div>
      <div style="font-size:12px;color:var(--text3);line-height:1.6;">${r.advice}</div>
    </div>
  </div>`
).join('');

const year = new Date().getFullYear();
const luckyData = [
  {dir:'东南',star:'紫白一白',type:'吉',desc:'财星到位，此方宜放财位摆件，可催旺财运与事业。',color:'#c9a84c'},
  {dir:'正南',star:'紫白六白',type:'吉',desc:'贵人星驾临，此方宜明亮，可招贵人相助。',color:'#81c784'},
  {dir:'正北',star:'五黄',type:'凶',desc:'五黄凶星，此方宜安静，避免动土装修，放铜葫芦化解。',color:'#ef9a9a'}
];
document.getElementById('lucky-areas').innerHTML = `
  <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">${year}年流年飞星分布</div>
  ${luckyData.map(l =>
    `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="width:36px;height:36px;border-radius:8px;background:${l.color}22;border:1px solid ${l.color}44;display:flex;align-items:center;justify-content:center;font-size:13px;color:${l.color};font-family:'Noto Serif SC',serif;">${l.dir}</div>
      <div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
          <span style="font-size:13px;color:var(--text);">${l.star}</span>
          <span class="tag ${l.type==='吉'?'tag-green':'tag-red'}" style="padding:2px 8px;font-size:11px;">${l.type}</span>
        </div>
        <div style="font-size:12px;color:var(--text3);line-height:1.5;">${l.desc}</div>
      </div>
    </div>`
  ).join('')}
`;
</script>
</body>
</html>
