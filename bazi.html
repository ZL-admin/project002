<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>八字算命 · 易经风水</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .wx-bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .wx-bar-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .wx-bar-label { width: 20px; color: var(--text-muted); }
    .wx-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
    .wx-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .wx-bar-val { width: 30px; text-align: right; color: var(--text-muted); font-size: 12px; }
    .dayun-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .dayun-item { flex: 0 0 64px; background: rgba(0,0,0,0.3); border: 1px solid rgba(139,69,19,0.4); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 12px; }
    .dayun-item .dy-gz { font-size: 15px; color: var(--gold); font-weight: 700; }
    .dayun-item .dy-age { color: var(--text-muted); margin-top: 4px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  </style>
</head>
<body>
<div class="page-wrapper">

  <!-- 导航 -->
  <div class="nav-bar">
    <a href="index.html" class="nav-back">返回</a>
    <div class="nav-title">八字算命</div>
    <div style="width:48px;"></div>
  </div>

  <!-- 输入表单 -->
  <div class="card">
    <div class="card-title">输入生辰八字</div>
    <div class="form-group">
      <label class="form-label">出生年份</label>
      <input type="number" class="form-input" id="birthYear" placeholder="例如：1990" min="1900" max="2099" value="">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">月份</label>
        <select class="form-select" id="birthMonth">
          <option value="">选择月份</option>
          <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">${i}月</option>`);</script>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">日期</label>
        <select class="form-select" id="birthDay">
          <option value="">选择日期</option>
          <script>for(let i=1;i<=31;i++) document.write(`<option value="${i}">${i}日</option>`);</script>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">出生时辰</label>
        <select class="form-select" id="birthHour">
          <option value="0">子时(23-1点)</option>
          <option value="2">丑时(1-3点)</option>
          <option value="4">寅时(3-5点)</option>
          <option value="6">卯时(5-7点)</option>
          <option value="8">辰时(7-9点)</option>
          <option value="10">巳时(9-11点)</option>
          <option value="12">午时(11-13点)</option>
          <option value="14">未时(13-15点)</option>
          <option value="16">申时(15-17点)</option>
          <option value="18">酉时(17-19点)</option>
          <option value="20">戌时(19-21点)</option>
          <option value="22">亥时(21-23点)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">性别</label>
        <select class="form-select" id="gender">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
    </div>
    <button class="btn-primary" onclick="calcBazi()">✦ 立即排盘 ✦</button>
  </div>

  <!-- 结果区（初始隐藏）-->
  <div id="resultArea" style="display:none;">

    <!-- 四柱 -->
    <div class="card">
      <div class="card-title">四柱八字</div>
      <div class="bazi-pillars" id="pillarsDisplay"></div>
    </div>

    <!-- 五行分布 -->
    <div class="card">
      <div class="card-title">五行分布</div>
      <div class="wx-bars" id="wxBars"></div>
    </div>

    <!-- 命盘信息 -->
    <div class="card">
      <div class="card-title">命盘解析</div>
      <div class="result-panel" id="analysisPanel"></div>
    </div>

    <!-- 性格特征 -->
    <div class="card">
      <div class="card-title">性格特征</div>
      <div id="personalityDesc" style="font-size:14px;color:var(--text-muted);line-height:1.8;"></div>
    </div>

    <!-- 喜忌神 -->
    <div class="card">
      <div class="card-title">喜忌分析</div>
      <div id="xijiPanel"></div>
    </div>

    <!-- 大运 -->
    <div class="card">
      <div class="card-title">大运流年</div>
      <div class="dayun-list" id="dayunList"></div>
    </div>

  </div>

  <div class="safe-bottom"></div>
</div>

<!-- 底部导航 -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <span class="nav-icon">🏠</span><span class="nav-text">首页</span>
  </a>
  <a href="bazi.html" class="nav-item active">
    <span class="nav-icon">🔮</span><span class="nav-text">八字</span>
  </a>
  <a href="daily.html" class="nav-item">
    <span class="nav-icon">🎋</span><span class="nav-text">每日签</span>
  </a>
  <a href="dream.html" class="nav-item">
    <span class="nav-icon">💤</span><span class="nav-text">解梦</span>
  </a>
  <a href="fengshui.html" class="nav-item">
    <span class="nav-icon">☯</span><span class="nav-text">风水</span>
  </a>
</nav>

<script src="js/bazi.js"></script>
<script>
function calcBazi() {
  const year  = parseInt(document.getElementById('birthYear').value);
  const month = parseInt(document.getElementById('birthMonth').value);
  const day   = parseInt(document.getElementById('birthDay').value);
  const hour  = parseInt(document.getElementById('birthHour').value);
  const gender = document.getElementById('gender').value;

  if (!year || !month || !day || isNaN(hour)) {
    alert('请完整填写生辰信息');
    return;
  }
  if (year < 1900 || year > 2099) {
    alert('请输入1900-2099之间的年份');
    return;
  }

  const bazi = BAZI.calc(year, month, day, hour);
  const wxScore = BAZI.wuxingScore(bazi);
  const { strength, xi, ji } = BAZI.xijiShen(bazi);
  const gj = BAZI.geju(bazi);
  const dyList = BAZI.dayun(bazi, year, gender);
  const shengxiao = BAZI.shengXiao(year);
  const xingzuo = BAZI.xingZuo(month, day);

  // 显示结果区
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });

  // 四柱
  const wxColors = { 木:'#27ae60', 火:'#e74c3c', 土:'#d4a017', 金:'#bdc3c7', 水:'#3498db' };
  const pillarsHtml = bazi.pillars.map((p, i) => {
    const tgWx = BAZI.TG_WUXING[p.tg];
    const dzWx = BAZI.DZ_WUXING[p.dz];
    return `
      <div class="pillar animate-in" style="animation-delay:${i*0.1}s">
        <div class="pillar-label">${bazi.labels[i]}</div>
        <div class="pillar-tg" style="color:${wxColors[tgWx]}">${p.tg}</div>
        <div class="pillar-dz" style="color:${wxColors[dzWx]}">${p.dz}</div>
        <div class="pillar-element">${tgWx}/${dzWx}</div>
      </div>`;
  }).join('');
  document.getElementById('pillarsDisplay').innerHTML = pillarsHtml;

  // 五行条
  const wxOrder = ['木','火','土','金','水'];
  const wxColorMap = { 木:'#27ae60', 火:'#e74c3c', 土:'#d4a017', 金:'#bdc3c7', 水:'#3498db' };
  const maxScore = Math.max(...Object.values(wxScore), 1);
  const wxBarsHtml = wxOrder.map(wx => {
    const score = wxScore[wx] || 0;
    const pct = Math.round(score / maxScore * 100);
    return `
      <div class="wx-bar-row">
        <div class="wx-bar-label">${wx}</div>
        <div class="wx-bar-track">
          <div class="wx-bar-fill" style="width:${pct}%;background:${wxColorMap[wx]};"></div>
        </div>
        <div class="wx-bar-val">${score.toFixed(1)}</div>
      </div>`;
  }).join('');
  document.getElementById('wxBars').innerHTML = wxBarsHtml;

  // 命盘解析
  const dayTg = bazi.day.tg;
  const dayWx = BAZI.TG_WUXING[dayTg];
  document.getElementById('analysisPanel').innerHTML = `
    <div class="result-row"><span class="result-key">日主</span><span class="result-val" style="color:${wxColors[dayWx]}">${dayTg}（${dayWx}）</span></div>
    <div class="result-row"><span class="result-key">生肖</span><span class="result-val">${shengxiao}</span></div>
    <div class="result-row"><span class="result-key">星座</span><span class="result-val">${xingzuo}</span></div>
    <div class="result-row"><span class="result-key">日主旺衰</span><span class="result-val ${strength==='旺'?'good':strength==='弱'?'bad':''}">${strength}</span></div>
    <div class="result-row"><span class="result-key">格局</span><span class="result-val good">${gj}</span></div>
    <div class="result-row"><span class="result-key">命局用神</span><span class="result-val">${xi.join('、')} 为喜</span></div>
  `;

  // 性格
  document.getElementById('personalityDesc').textContent = BAZI.personalityDesc(dayTg);

  // 喜忌
  const wxNameMap = { 木:'木（东方·绿色·春季）', 火:'火（南方·红色·夏季）', 土:'土（中央·黄色·四季末）', 金:'金（西方·白色·秋季）', 水:'水（北方·黑色·冬季）' };
  document.getElementById('xijiPanel').innerHTML = `
    <div style="margin-bottom:10px;">
      <div style="font-size:13px;color:var(--gold);margin-bottom:6px;">✦ 喜用神</div>
      <div class="tag-list">${xi.map(w=>`<span class="tag tag-ji">${w}</span>`).join('')}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">宜：${xi.map(w=>wxNameMap[w]||w).join(' / ')}</div>
    </div>
    <div>
      <div style="font-size:13px;color:var(--red-light);margin-bottom:6px;">✦ 忌神</div>
      <div class="tag-list">${ji.map(w=>`<span class="tag tag-xiong">${w}</span>`).join('')}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">忌：${ji.map(w=>wxNameMap[w]||w).join(' / ')}</div>
    </div>
  `;

  // 大运
  document.getElementById('dayunList').innerHTML = dyList.map(dy => `
    <div class="dayun-item">
      <div class="dy-gz">${dy.label}</div>
      <div class="dy-age">${dy.startAge}岁</div>
      <div class="dy-age">${dy.startYear}年</div>
    </div>
  `).join('');
}
</script>
</body>
</html>
