<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>昨夜的梦 · 天机命理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="star-canvas"></canvas>

<div class="topbar">
  <div>
    <div class="topbar-title">🌙 昨夜的梦</div>
    <div class="topbar-sub">你昨晚梦到了什么？</div>
  </div>
</div>

<div class="page">
  <div style="height:16px;"></div>

  <div class="card fade-in" style="margin-bottom:12px;">
    <div class="search-bar">
      <input class="search-input" id="search-input" placeholder="输入梦境关键词…" oninput="doSearch()">
      <button class="search-btn" onclick="doSearch()">搜索</button>
    </div>
    <div class="cat-tabs" id="cat-tabs"></div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">热门标签</div>
    <div class="hot-tags" id="hot-tags"></div>
  </div>

  <div id="results"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>首页</a>
  <a href="destiny.html" class="nav-item"><span class="nav-icon">☯️</span>命运</a>
  <a href="sign.html"    class="nav-item"><span class="nav-icon">🔮</span>今日签</a>
  <a href="yuanfen.html" class="nav-item"><span class="nav-icon">💑</span>缘分</a>
  <a href="dream.html"   class="nav-item active"><span class="nav-icon">🌙</span>解梦</a>
</nav>

<script src="js/dream.js"></script>
<script>
(function(){const c=document.getElementById('star-canvas'),ctx=c.getContext('2d');let stars=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}function init(){resize();stars=Array.from({length:80},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1+0.2,a:Math.random(),speed:Math.random()*0.003+0.001}));}function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a+=s.speed;if(s.a>1)s.a=0;const alpha=Math.abs(Math.sin(s.a*Math.PI));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(200,180,255,${alpha*0.5})`;ctx.fill();});requestAnimationFrame(draw);}window.addEventListener('resize',init);init();draw();})();

let curCat = '全部';

document.getElementById('cat-tabs').innerHTML = DREAM_CATEGORIES.map(cat =>
  `<div class="cat-tab${cat===curCat?' active':''}" onclick="setCat('${cat}')">${cat}</div>`
).join('');

const hotKeywords = ['龙','鱼','飞翔','钱','太阳','房子','婴儿','大海','花','老虎','结婚','彩虹'];
document.getElementById('hot-tags').innerHTML = hotKeywords.map(kw =>
  `<span class="hot-tag" onclick="searchTag('${kw}')">${kw}</span>`
).join('');

renderResults(DREAM_DICT.slice(0,20));

function setCat(cat) {
  curCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t =>
    t.classList.toggle('active', t.textContent===cat));
  doSearch();
}
function searchTag(kw) {
  document.getElementById('search-input').value = kw;
  doSearch();
}
function doSearch() {
  const kw = document.getElementById('search-input').value.trim();
  renderResults(searchDreams(kw, curCat).slice(0,30));
}
function renderResults(results) {
  if (!results.length) {
    document.getElementById('results').innerHTML =
      '<div class="empty"><div class="empty-icon">🌙</div>未找到相关梦境，换个关键词试试</div>';
    return;
  }
  const fc = {'大吉':'#c9a84c','吉':'#81c784','中':'#90caf9','凶':'#ef9a9a'};
  document.getElementById('results').innerHTML = results.map(d =>
    `<div class="dream-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div class="dream-kw">梦见${d.kw}</div>
        <span class="tag" style="color:${fc[d.fortune]||'var(--gold)'};border-color:${fc[d.fortune]||'var(--gold)'}44;">${d.fortune}</span>
      </div>
      <div class="dream-meaning">${d.meaning}</div>
      <div class="dream-detail">${d.detail}</div>
    </div>`
  ).join('');
}
</script>
</body>
</html>
