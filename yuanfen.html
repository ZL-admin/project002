<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>缘分测算 · 天机命理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="star-canvas"></canvas>

<div class="topbar">
  <div>
    <div class="topbar-title">💑 缘分测算</div>
    <div class="topbar-sub">两个生日，一段天注定的缘分</div>
  </div>
</div>

<div class="page">
  <div style="height:16px;"></div>

  <div class="card fade-in" style="margin-bottom:12px;">
    <div class="section-title">输入两人生日</div>
    <div class="form-group">
      <label class="form-label">💛 我的生日</label>
      <input type="date" class="form-input" id="date-a" value="1992-03-15">
    </div>
    <div class="form-group">
      <label class="form-label">💗 TA 的生日</label>
      <input type="date" class="form-input" id="date-b" value="1994-07-22">
    </div>
    <button class="btn btn-gold btn-full" onclick="calcYuanfen()">✦ 测算缘分契合度</button>
  </div>

  <div id="result" style="display:none;">
    <!-- Compat Ring -->
    <div class="card fade-in" style="margin-bottom:12px;text-align:center;">
      <div class="section-title" style="justify-content:center;">契合指数</div>
      <div class="compat-ring" id="compat-ring">
        <svg viewBox="0 0 140 140" width="140" height="140">
          <circle cx="70" cy="70" r="58" stroke="rgba(255,255,255,0.08)" />
          <circle cx="70" cy="70" r="58" id="compat-arc"
            stroke="#c9a84c" stroke-dasharray="0 364" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="compat-score-text" id="compat-score">0</div>
          <div class="compat-label" id="compat-grade">测算中…</div>
        </div>
      </div>
      <div style="font-size:14px;color:var(--text2);margin-top:12px;" id="compat-summary"></div>
    </div>

    <!-- Dimension Scores -->
    <div class="card fade-in-2" style="margin-bottom:12px;">
      <div class="section-title">多维度契合</div>
      <div id="dim-scores"></div>
    </div>

    <!-- Advice -->
    <div class="card fade-in-3" style="margin-bottom:12px;">
      <div class="section-title">缘分建议</div>
      <div id="compat-advice" style="font-size:13px;color:var(--text2);line-height:1.8;"></div>
    </div>

    <!-- Share -->
    <div style="margin-bottom:16px;">
      <button class="btn btn-outline btn-full" onclick="shareResult()">📤 分享契合报告</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>首页</a>
  <a href="destiny.html" class="nav-item"><span class="nav-icon">☯️</span>命运</a>
  <a href="sign.html"    class="nav-item"><span class="nav-icon">🔮</span>今日签</a>
  <a href="yuanfen.html" class="nav-item active"><span class="nav-icon">💑</span>缘分</a>
  <a href="dream.html"   class="nav-item"><span class="nav-icon">🌙</span>解梦</a>
</nav>

<script src="js/bazi.js"></script>
<script>
(function(){const c=document.getElementById('star-canvas'),ctx=c.getContext('2d');let stars=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}function init(){resize();stars=Array.from({length:100},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+0.2,a:Math.random(),speed:Math.random()*0.003+0.001}));}function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a+=s.speed;if(s.a>1)s.a=0;const alpha=Math.abs(Math.sin(s.a*Math.PI));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,220,${alpha*0.7})`;ctx.fill();});requestAnimationFrame(draw);}window.addEventListener('resize',init);init();draw();})();

let lastResult = null;

function seeded(seed){let s=seed>>>0;return function(){s+=0x6D2B79F5;let t=Math.imul(s^(s>>>15),1|s);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296;};}

function calcYuanfen() {
  const da = document.getElementById('date-a').value;
  const db = document.getElementById('date-b').value;
  if (!da || !db) return;

  const [ya,ma,dya] = da.split('-').map(Number);
  const [yb,mb,dyb] = db.split('-').map(Number);

  const baziA = calcBazi(ya,ma,dya,9);
  const baziB = calcBazi(yb,mb,dyb,9);

  // Compatibility via element relationships
  const eA = baziA.dayElem, eB = baziB.dayElem;
  let base = 60;
  if (GENERATES[eA]===eB || GENERATES[eB]===eA) base += 25; // mutual generation
  else if (eA===eB) base += 15; // same element
  else if (RESTRAINS[eA]===eB || RESTRAINS[eB]===eA) base -= 10; // restraint

  // Seed from both birthdays
  const seed = (ya*10000+ma*100+dya) ^ (yb*10000+mb*100+dyb);
  const rng = seeded(seed);
  const total = Math.min(99, Math.max(45, Math.round(base + (rng()-0.5)*30)));

  const dims = [
    {label:'性格契合', icon:'🌟', score: Math.min(99,Math.max(40,Math.round(total+(rng()-0.5)*20)))},
    {label:'感情默契', icon:'💗', score: Math.min(99,Math.max(40,Math.round(total+(rng()-0.5)*20)))},
    {label:'生活节奏', icon:'🏡', score: Math.min(99,Math.max(40,Math.round(total+(rng()-0.5)*20)))},
    {label:'事业互补', icon:'💼', score: Math.min(99,Math.max(40,Math.round(total+(rng()-0.5)*20)))},
  ];

  const grades = [
    {min:90,text:'天作之合',desc:'命中注定的灵魂伴侣，两人五行相生相辅，缘分深厚，是极为难得的绝配。'},
    {min:75,text:'良缘相配',desc:'两人五行和谐，性格互补，只要用心经营，感情将越来越深厚。'},
    {min:60,text:'有缘相聚',desc:'缘分不浅，有一定的共同基础，需要多一些包容与理解，感情可以长久。'},
    {min:0, text:'缘浅情深',desc:'五行上有一定冲突，但缘分的深浅不只由命决定，真心与用心同样重要。'}
  ];
  const grade = grades.find(g => total >= g.min);

  lastResult = {total, grade, dims, eA, eB};
  renderResult(lastResult);
}

function renderResult({total, grade, dims, eA, eB}) {
  document.getElementById('result').style.display = 'block';

  // Animate score
  const arc = document.getElementById('compat-arc');
  const circumference = 2*Math.PI*58;
  let cur = 0;
  const interval = setInterval(() => {
    cur = Math.min(cur+2, total);
    document.getElementById('compat-score').textContent = cur;
    arc.setAttribute('stroke-dasharray', `${(cur/100)*circumference} ${circumference}`);
    if (cur >= total) clearInterval(interval);
  }, 20);

  const gradeColor = total>=90?'var(--gold-lt)':total>=75?'#81d4fa':total>=60?'#a5d6a7':'#ef9a9a';
  document.getElementById('compat-grade').textContent = grade.text;
  document.getElementById('compat-grade').style.color = gradeColor;
  document.getElementById('compat-summary').textContent = `${eA}命 × ${eB}命`;

  // Dimensions
  document.getElementById('dim-scores').innerHTML = dims.map(d => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="width:24px;font-size:16px;">${d.icon}</div>
      <div style="flex:1;">
        <div style="font-size:13px;color:var(--text2);margin-bottom:4px;">${d.label}</div>
        <div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${d.score}%;background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt));border-radius:3px;transition:width 1s;"></div>
        </div>
      </div>
      <div style="font-size:13px;color:var(--gold);width:28px;text-align:right;">${d.score}</div>
    </div>
  `).join('');

  document.getElementById('compat-advice').textContent = grade.desc;
}

function shareResult() {
  if (!lastResult) return;
  const {total, grade} = lastResult;
  const text = `✦ 天机命理 · 缘分测算\n\n契合指数：${total}分（${grade.text}）\n\n${grade.desc}\n\nhttps://zl-admin.github.io/project002/`;
  if (navigator.share) {
    navigator.share({title:'缘分契合报告', text}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=>alert('报告已复制，粘贴分享给 TA 吧 ✦')).catch(()=>alert(text));
  }
}
</script>
</body>
</html>
