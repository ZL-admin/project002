<script src="js/daily.js"></script>
<script src="js/hexagram.js"></script>
<script>
(function(){
  const c=document.getElementById('star-canvas'),ctx=c.getContext('2d');let stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  function init(){resize();stars=Array.from({length:120},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+0.2,a:Math.random(),speed:Math.random()*0.003+0.001}));}
  function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a+=s.speed;if(s.a>1)s.a=0;const alpha=Math.abs(Math.sin(s.a*Math.PI));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,220,${alpha*0.7})`;ctx.fill();});requestAnimationFrame(draw);}
  window.addEventListener('resize',init);init();draw();
})();

const today=new Date();
const weekdays=['日','一','二','三','四','五','六'];
document.getElementById('top-date').textContent=`${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日 周${weekdays[today.getDay()]}`;
const zodiac=getZodiacEmoji(today);
document.getElementById('top-zodiac').textContent=zodiac.emoji;
document.getElementById('day-lunar').textContent=getLunarDisplay(today)+' · '+zodiac.sign;

const scores=getFortuneScores(today);
const dayInfo=getDayLabel(scores);
document.getElementById('day-label').textContent='✨ 今天是你的'+dayInfo.text;

const scoreItems=[{key:'career',emoji:'💼',label:'事业'},{key:'love',emoji:'💗',label:'爱情'},{key:'wealth',emoji:'💰',label:'财运'},{key:'health',emoji:'🌿',label:'健康'}];
const scoreColors={career:'#c9a84c',love:'#f48fb1',wealth:'#81c784',health:'#4fc3f7'};
document.getElementById('score-grid').innerHTML=scoreItems.map(item=>{
  const val=scores[item.key];
  const cls=val>=80?'score-great':val>=65?'score-good':val>=50?'score-mid':'score-low';
  return `<div class="score-item ${cls}"><div class="score-emoji">${item.emoji}</div><div class="score-label">${item.label}</div><div class="score-value">${val}</div><div class="score-bar"><div class="score-bar-fill" style="width:${val}%;background:${scoreColors[item.key]};"></div></div></div>`;
}).join('');

const yiji=getYiJi(today);
document.getElementById('yi-row').innerHTML=yiji.yi.map(t=>`<div class="yiji-item"><span class="yi-dot"></span>${t}</div>`).join('');
document.getElementById('ji-row').innerHTML=yiji.ji.map(t=>`<div class="yiji-item"><span class="ji-dot"></span>${t}</div>`).join('');

const cloth=getClothing(today);
document.getElementById('cloth-theme').textContent='今日'+cloth.desc;
document.getElementById('cloth-avoid').textContent='禁忌：'+cloth.avoid;
document.getElementById('cloth-colors').innerHTML=cloth.lucky.map(c=>`<div class="color-swatch" style="background:${c};"></div>`).join('');
document.getElementById('cloth-items').innerHTML=cloth.items.map(i=>`<span class="clothing-item">${i}</span>`).join('');

const hex=getHexagramByDate(today);
document.getElementById('hex-lines').innerHTML=drawHexagram(hex);
document.getElementById('hex-name').textContent=hex.name+'卦';
document.getElementById('hex-fortune').textContent='运势：'+hex.fortune;
document.getElementById('hex-brief').textContent=hex.brief;
</script>
