      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee { display: inline-block; animation: scroll-left 18s linear infinite; }
    @keyframes scroll-left { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
  </style>

<script src="js/hexagram.js"></script>
<script>
  // 今日日期
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const week = ['日','一','二','三','四','五','六'][now.getDay()];
  document.getElementById('todayDate').textContent = `${y}年${m}月${d}日 星期${week}`;

  // 天干地支年份
  const TG = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const DZ = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const animals = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  const yearTg = TG[(y-4)%10], yearDz = DZ[(y-4)%12];
  const animal = animals[(y-4)%12];

  // 今日运势（基于日期hash）
  const dateKey = `${y}${m}${d}`;
  let hash = 0;
  for(let i=0;i<dateKey.length;i++) hash = (hash*31+dateKey.charCodeAt(i))>>>0;
  const lucks = ['大吉','吉','小吉','中平','小凶'];
  const luckIdx = hash % 5;
  const luck = lucks[luckIdx];
  const wxArr = ['木','火','土','金','水'];
  const wx = wxArr[hash % 5];
  const wxEmoji = {'木':'🌿','火':'🔥','土':'🌏','金':'⚡','水':'💧'}[wx];

  document.getElementById('todayLuck').textContent = `今日运势：${luck}`;
  document.getElementById('todayWx').textContent = wxEmoji;

  // 今日卦象
  const hexagram = HEXAGRAM.getByDate(dateKey);
  document.getElementById('todayHexagram').innerHTML = `
    <div class="hexagram-symbol">${hexagram.symbol}</div>
    <div class="hexagram-name">${hexagram.fullName}</div>
    <div class="tag tag-${hexagram.luck==='大吉'?'ji':hexagram.luck==='凶'?'xiong':'ping'}" style="margin:8px 0;">${hexagram.luck}</div>
    <div class="hexagram-judgment" style="padding:0 12px;">${hexagram.meaning}</div>
    <a href="daily.html" style="display:inline-block;margin-top:12px;font-size:13px;color:var(--gold);text-decoration:none;">查看详解 →</a>
  `;

  // 万年历信息
  const monthDz = DZ[(m+1)%12];
  document.getElementById('calendarInfo').innerHTML = `
    <div class="result-row"><span class="result-key">农历年份</span><span class="result-val">${yearTg}${yearDz}年（${animal}年）</span></div>
    <div class="result-row"><span class="result-key">今日干支</span><span class="result-val">${TG[(d+hash)%10]}${DZ[(d+hash)%12]}</span></div>
    <div class="result-row"><span class="result-key">当月月令</span><span class="result-val">${monthDz}月</span></div>
    <div class="result-row"><span class="result-key">今日五行</span><span class="result-val wx-${{'木':'wood','火':'fire','土':'earth','金':'metal','水':'water'}[wx]}">${wx}</span></div>
    <div class="result-row"><span class="result-key">宜</span><span class="result-val good">祈福 · 出行 · 交友</span></div>
    <div class="result-row"><span class="result-key">忌</span><span class="result-val bad">动土 · 争讼 · 冒险</span></div>
  `;
</script>
</body>
