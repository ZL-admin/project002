<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>数字命运 · 天机命理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="star-canvas"></canvas>

<div class="topbar">
  <div>
    <div class="topbar-title">🔢 数字命运</div>
    <div class="topbar-sub">出生数字藏着什么秘密</div>
  </div>
</div>

<div class="page">
  <div style="height:16px;"></div>

  <!-- Input -->
  <div class="card fade-in" style="margin-bottom:12px;">
    <div class="section-title">输入出生日期</div>
    <div class="form-group">
      <label class="form-label">出生日期</label>
      <input type="date" class="form-input" id="birth-date" value="1990-01-01">
    </div>
    <button class="btn btn-gold btn-full" onclick="calcDestinyNumber()">✦ 解析数字命运</button>
  </div>

  <!-- Result -->
  <div id="result" style="display:none;">

    <!-- Life Path Number -->
    <div class="card fade-in" style="margin-bottom:12px;text-align:center;">
      <div class="section-title" style="justify-content:center;">生命数字</div>
      <div style="font-family:'Noto Serif SC',serif;font-size:72px;font-weight:700;
        background:linear-gradient(135deg,var(--gold-dk),var(--gold-lt));
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        background-clip:text;line-height:1;margin:8px 0;" id="life-num">—</div>
      <div style="font-size:15px;color:var(--gold);" id="life-title">—</div>
      <div style="font-size:13px;color:var(--text3);margin-top:8px;line-height:1.6;padding:0 12px;" id="life-desc">—</div>
    </div>

    <!-- Nine Palace -->
    <div class="card fade-in-2" style="margin-bottom:12px;">
      <div class="section-title">九宫飞星图</div>
      <div class="nine-grid" id="nine-grid"></div>
    </div>

    <!-- Sub Numbers -->
    <div class="card fade-in-3" style="margin-bottom:12px;">
      <div class="section-title">辅助数字解析</div>
      <div id="sub-nums"></div>
    </div>

  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>首页</a>
  <a href="destiny.html" class="nav-item"><span class="nav-icon">☯️</span>命运</a>
  <a href="sign.html"    class="nav-item"><span class="nav-icon">🔮</span>今日签</a>
  <a href="yuanfen.html" class="nav-item"><span class="nav-icon">💑</span>缘分</a>
  <a href="dream.html"   class="nav-item"><span class="nav-icon">🌙</span>解梦</a>
</nav>

<script>
(function(){const c=document.getElementById('star-canvas'),ctx=c.getContext('2d');let stars=[];function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}function init(){resize();stars=Array.from({length:80},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1+0.2,a:Math.random(),speed:Math.random()*0.003+0.001}));}function draw(){ctx.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.a+=s.speed;if(s.a>1)s.a=0;const alpha=Math.abs(Math.sin(s.a*Math.PI));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(180,160,255,${alpha*0.5})`;ctx.fill();});requestAnimationFrame(draw);}window.addEventListener('resize',init);init();draw();})();

const LIFE_NUMBERS = {
  1:{title:'领袖先锋',desc:'天生的领导者，独立自主，勇于开创，善于独当一面。你的使命是引领他人，走在时代前沿。'},
  2:{title:'和谐使者',desc:'极具同理心，善于合作与调解，感情细腻，是天生的外交官。你的使命是带来和谐与平衡。'},
  3:{title:'创意表达',desc:'才华横溢，创意无限，表达能力出众，天生的艺术家与沟通者。你的使命是传递美与喜悦。'},
  4:{title:'稳固基石',desc:'踏实勤劳，做事有条不紊，是值得信赖的基石。你的使命是通过努力构建稳固的基础。'},
  5:{title:'自由探索',desc:'热爱自由与变化，好奇心旺盛，适应力强，天生的冒险家。你的使命是探索世界，拥抱变化。'},
  6:{title:'爱与责任',desc:'责任感强，充满爱心，天生的照顾者与保护者。你的使命是以爱滋养家庭与社区。'},
  7:{title:'智慧探求',desc:'思维深邃，喜欢独处与钻研，直觉强烈，是天生的哲学家与研究者。你的使命是追求真理。'},
  8:{title:'权威财富',desc:'具有强烈的事业心与商业头脑，能够积累财富与权威。你的使命是展示物质世界的丰盛。'},
  9:{title:'宇宙智慧',desc:'博爱宽怀，富有远见，具有强烈的使命感。你的使命是超越小我，服务众生，传承智慧。'}
};

const NINE_PALACE = [
  {pos:'东南',num:4,name:'四绿文昌',type:'文昌',fortune:'学业'},
  {pos:'正南',num:9,name:'九紫右弼',type:'吉',fortune:'声名'},
  {pos:'西南',num:2,name:'二黑病符',type:'病',fortune:'健康'},
  {pos:'正东',num:3,name:'三碧蚩尤',type:'凶',fortune:'口舌'},
  {pos:'中宫',num:5,name:'五黄廉贞',type:'凶',fortune:'化解'},
  {pos:'正西',num:7,name:'七赤破军',type:'凶',fortune:'防盗'},
  {pos:'东北',num:8,name:'八白左辅',type:'吉',fortune:'财富'},
  {pos:'正北',num:1,name:'一白贪狼',type:'吉',fortune:'事业'},
  {pos:'西北',num:6,name:'六白武曲',type:'吉',fortune:'贵人'}
];

function digitSum(n) {
  while (n > 9) {
    n = String(n).split('').reduce((a,b)=>a+parseInt(b),0);
  }
  return n;
}

function calcDestinyNumber() {
  const dateStr = document.getElementById('birth-date').value;
  if (!dateStr) return;
  const digits = dateStr.replace(/-/g,'').split('').map(Number);
  const sum = digits.reduce((a,b)=>a+b,0);
  const lifeNum = digitSum(sum);

  document.getElementById('result').style.display = 'block';
  document.getElementById('life-num').textContent = lifeNum;
  const info = LIFE_NUMBERS[lifeNum] || LIFE_NUMBERS[9];
  document.getElementById('life-title').textContent = info.title;
  document.getElementById('life-desc').textContent = info.desc;

  // Nine palace — arrange in order: NW N NE / W C E / SW S SE
  const order = [6,1,8, 7,5,3, 2,9,4]; // palace nums in grid order
  const palaces = order.map(n => NINE_PALACE.find(p=>p.num===n));
  const typeColors = {吉:'#c9a84c',文昌:'#81c784',凶:'#ef9a9a',病:'#ef9a9a'};
  document.getElementById('nine-grid').innerHTML = palaces.map((p,i) =>
    `<div class="palace-cell${i===4?' center':''}">
      <div class="palace-num" style="color:${typeColors[p.type]||'var(--gold-lt)'};">${p.num}</div>
      <div class="palace-dir">${p.pos}</div>
      <div class="palace-star" style="color:${typeColors[p.type]||'var(--text3)'};">${p.type}</div>
    </div>`
  ).join('');

  // Sub numbers
  const [y,m,d] = dateStr.split('-').map(Number);
  const subNums = [
    {label:'出生月份数', num:digitSum(m), desc:'反映你的情感模式与内在需求'},
    {label:'出生日期数', num:digitSum(d), desc:'揭示你的个性特质与表达方式'},
    {label:'出生年份数', num:digitSum(y), desc:'代表你的人生背景与成长课题'}
  ];
  document.getElementById('sub-nums').innerHTML = subNums.map(s =>
    `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC',serif;font-size:20px;color:var(--gold-lt);">${s.num}</div>
      <div>
        <div style="font-size:13px;color:var(--text);">${s.label}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px;">${s.desc}</div>
      </div>
    </div>`
  ).join('');
}

// Auto-load
const saved = localStorage.getItem('destinyBirth');
if (saved) {
  const d = JSON.parse(saved);
  document.getElementById('birth-date').value = d.date;
  calcDestinyNumber();
}
</script>
</body>
</html>
